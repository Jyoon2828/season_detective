<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b58">
  <meta name="description" content="여름이 길어지고 겨울이 짧아진다면? 네 가지 자료를 나눠 읽고, 근거를 찾아 예상하며, 태블릿을 보여 주고 토의하는 4학년 과학 탐구 활동입니다.">
  <title>계절 탐정단 | 여름이 길어지고 겨울이 짧아진다면?</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로 가기</a>
  <header class="site-header">
    <button type="button" class="brand" data-action="home" aria-label="계절 탐정단 자료 선택으로">
      <img src="assets/logo.svg" alt="" width="43" height="43">
      <span>계절 탐정단<small>4학년 과학 · 단원 열기</small></span>
    </button>
    <div class="header-actions">
      <span id="save-state" class="save-state" role="status">이 기기에 자동 저장</span>
      <button type="button" class="button ghost small" data-action="guide">수업 안내</button>
      <button type="button" class="button ghost small" data-action="sources">자료 출처</button>
    </div>
  </header>
  <nav id="progress" class="progress" aria-label="활동 단계"></nav>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer"><span>정답을 맞히기보다, 자료를 보고 이유를 생각해요.</span><button type="button" data-action="reset">이 기기의 기록 지우기</button></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
